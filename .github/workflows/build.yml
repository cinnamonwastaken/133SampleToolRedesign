name: Build Electron App

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Electron app (no publish)
        run: npm run package -- --publish=never

      # The macOS .dmg can only be produced on a macOS runner: dmg creation
      # needs hdiutil, and build/afterPack.js needs codesign to apply the
      # ad-hoc signature that lets the arm64 build launch at all. A mac target
      # packed on Linux/Windows would ship an app that cannot open.
      - name: Verify macOS artifacts are signed
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          for app in dist/mac*/*.app; do
            echo "Verifying $app"
            codesign --verify --deep --strict "$app"
          done
          ls -la dist/*.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          # Fail rather than silently publishing an empty artifact if a target
          # produced nothing.
          if-no-files-found: error
          path: |
            dist/*.*

